name: Fetch CEPT MIS CBSTrans3 BO reports and update dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r automation/requirements.txt
      - run: playwright install --with-deps chromium
      - run: python automation/cept_mis_cbs.py
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mis-debug
          path: debug/
      - name: Commit merged KPI workbooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports
          git diff --cached --quiet || git commit -m "Auto-update CEPT MIS KPI exports $(date -u +%F)"
          git push
