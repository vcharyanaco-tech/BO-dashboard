name: Fetch CEPT MIS CBSTrans3 BO reports and update dashboard

# Single automation entry point (this used to be split across cept-mis.yml and
# dashboard.yml, which raced on commits to main). Runs twice a day and commits
# data/exports/*_merged.xlsx + data/exports/manifest.json + data/history.csv +
# data/dashboard_data.xlsx.

on:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/**'
  schedule:
    - cron: '30 12 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      report_start_date:
        description: 'Report window start (DD-MM-YYYY). Blank = the day before the run'
        required: false
        default: ''
      report_end_date:
        description: 'Report window end (DD-MM-YYYY). Blank = the day before the run'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: cept-mis-update
  cancel-in-progress: false

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r automation/requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run CEPT MIS automation
        # Empty inputs fall through to the script's default window (yesterday),
        # so a scheduled/pushed run behaves exactly as before. A dispatch can
        # re-fetch one specific day (start = end) to repair history. Sunday is a
        # holiday for every office, so the default never fetches one (it rolls back
        # to Saturday) and a Sunday-only window exits without downloading anything.
        #
        # timeout: a last-resort backstop. The script runs one bounded child per SUB
        # DIVISION (SUB_BUDGET_S) and retries the ones that come back with nothing
        # (SUB_RETRIES), so a wedged MIS page costs the one sub division that is broken.
        # 04-11 proved both halves of that: 30 of 42 minutes went on three hangs that
        # took whole divisions down with them (409 of ~2,100 BO rows), and the next day's
        # sub-division run needed only 13 minutes for 27 of 31. Worst case now: 420s label
        # visit + SUB_RETRIES rounds capped by SUPERVISOR_BUDGET_S (120 min), so 140
        # minutes still bounds the step and leaves sanity + debug artifacts room to run.
        env:
          REPORT_START_DATE: ${{ github.event.inputs.report_start_date }}
          REPORT_END_DATE: ${{ github.event.inputs.report_end_date }}
        run: timeout --kill-after=60s 8400s python -u automation/cept_mis_cbs.py
      - name: Sanity-check merged exports before committing
        run: python -u automation/sanity_check.py
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mis-debug
          path: debug/
      - name: Commit and push data (exports, manifest, history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes - nothing to commit."
          else
            git commit -m "Auto-update CEPT MIS KPI exports + history $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
      # Commits pushed with GITHUB_TOKEN do NOT trigger other workflows (GitHub
      # suppresses recursive runs), so pages.yml would otherwise keep serving the
      # previous data after every automated update. workflow_dispatch is the one
      # documented exception, so explicitly kick off the Pages deployment.
      - name: Trigger GitHub Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
