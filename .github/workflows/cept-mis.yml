name: Fetch CEPT MIS CBSTrans3 BO reports and update dashboard

# Single automation entry point (this used to be split across cept-mis.yml and
# dashboard.yml, which raced on commits to main). Runs twice a day and commits
# data/exports/*_merged.xlsx + data/exports/manifest.json + data/history.csv +
# data/dashboard_data.xlsx.

on:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/**'
  schedule:
    - cron: '30 12 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      report_start_date:
        description: 'Report window start (DD-MM-YYYY). Blank = the day before the run'
        required: false
        default: ''
      report_end_date:
        description: 'Report window end (DD-MM-YYYY). Blank = the day before the run'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: cept-mis-update
  cancel-in-progress: false

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r automation/requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run CEPT MIS automation
        # Empty inputs fall through to the script's default window (yesterday),
        # so a scheduled/pushed run behaves exactly as before. A dispatch can
        # re-fetch one specific day (start = end) to repair history.
        #
        # timeout: one page can wedge (04-11 lost 3 hours on Gurgaon Division with
        # no log line at all) and the only thing that ends such a run is the job
        # cap, which wastes the runner minutes and hides the failure behind
        # "cancelled". 40 minutes was ~2x the fastest completed sweep, but it is
        # also shorter than a wedge plus a sweep: 04-11 14:52 ran 6/6 sub divisions
        # in the first 90 seconds, then lost 39 minutes to one silent page and hit
        # the cap with nothing merged - the merge happens at the end, so a killed
        # run commits no data at all. 100 minutes = one wedge (~40 min) plus a full
        # sweep (~20 min) with room to spare, still under the 180-minute job cap,
        # and a timeout here fails the step so the debug artifact step still runs.
        env:
          REPORT_START_DATE: ${{ github.event.inputs.report_start_date }}
          REPORT_END_DATE: ${{ github.event.inputs.report_end_date }}
        run: timeout --kill-after=60s 6000s python -u automation/cept_mis_cbs.py
      - name: Sanity-check merged exports before committing
        run: python -u automation/sanity_check.py
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mis-debug
          path: debug/
      - name: Commit and push data (exports, manifest, history)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes - nothing to commit."
          else
            git commit -m "Auto-update CEPT MIS KPI exports + history $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
      # Commits pushed with GITHUB_TOKEN do NOT trigger other workflows (GitHub
      # suppresses recursive runs), so pages.yml would otherwise keep serving the
      # previous data after every automated update. workflow_dispatch is the one
      # documented exception, so explicitly kick off the Pages deployment.
      - name: Trigger GitHub Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
