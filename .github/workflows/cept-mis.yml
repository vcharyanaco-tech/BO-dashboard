name: Fetch CEPT MIS BO report and update dashboard

on:
  schedule:
    - cron: '30 12 * * *'  # 6:00 PM IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas openpyxl
      - run: python automation/cept_mis_fetch.py
        env:
          REPORT_URL: ${{ vars.REPORT_URL }}
      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.xlsx
          git diff --cached --quiet || git commit -m "Auto-update CEPT MIS dashboard data $(date -u +%F)"
          git push
