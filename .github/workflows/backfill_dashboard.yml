name: Backfill Dashboard Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas openpyxl
      - name: Generate dashboard_data.xlsx from merged KPI files
        run: python -u backfill_dashboard.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard_data.xlsx
          git diff --cached --quiet || git commit -m "Backfill dashboard data from merged KPI files [skip ci]"
          git pull --rebase origin main
          git push
